<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReplayLab — бектест на історії</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#131722;
    --panel:#1e222d;
    --panel-2:#2a2e39;
    --border:#2a2e39;
    --text:#d1d4dc;
    --muted:#787b86;
    --muted-2:#9598a1;
    --accent:#2962ff;
    --accent-dim:#132242;
    --long:#26a69a;
    --long-dim:#0f2b28;
    --short:#ef5350;
    --short-dim:#3a1c1b;
  }
  :root[data-theme="light"]{
    --bg:#ffffff;
    --panel:#f8f9fd;
    --panel-2:#eef0f6;
    --border:#e0e3eb;
    --text:#131722;
    --muted:#787b86;
    --muted-2:#5d606b;
    --accent-dim:#e8f0ff;
    --long-dim:#dff5f1;
    --short-dim:#fde8e8;
  }
  body{ transition: background-color .15s, color .15s; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%; overflow:hidden;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;}
  .app{
    height:100vh; max-width:none; margin:0; padding:0 12px 8px;
    display:flex; flex-direction:column;
  }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 4px; border-bottom:1px solid var(--border); margin-bottom:8px; flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand-dot{width:9px; height:9px; border-radius:50%; background:var(--accent);}
  h1{font-weight:600; font-size:15px; margin:0; letter-spacing:.01em;}
  .subtitle{font-size:11.5px; color:var(--muted); margin:0;}

  .btn{
    font-family:inherit; font-size:12.5px; border-radius:4px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    padding:6px 11px; cursor:pointer;
  }
  .btn:hover{border-color:#3c4250; background:var(--panel-2);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .btn-primary:hover{filter:brightness(1.12); background:var(--accent);}
  .btn-long{background:var(--long-dim); color:var(--long); border-color:var(--long);}
  .btn-short{background:var(--short-dim); color:var(--short); border-color:var(--short);}
  select, input[type=text], input[type=number]{
    font-family:inherit; font-size:12.5px; border-radius:4px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    padding:6px 9px;
  }

  .panel-box{
    border:1px solid var(--border); border-radius:6px; background:var(--panel);
    padding:8px 12px; margin-bottom:8px; flex-shrink:0;
  }
  .panel-title{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin:0 0 10px;
  }

  .loader-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap;}
  .loader-row input[type=file]{ font-size:12px; color:var(--muted-2); }
  .hint{font-size:10.5px; color:var(--muted); margin:0 0 0 4px; display:inline-block;}
  .hint b{color:var(--muted-2);}

  /* ===== Chart shell: vertical toolbar + chart, TradingView style ===== */
  .chart-shell{ display:flex; gap:0; border:1px solid var(--border); border-radius:6px; overflow:hidden; flex:1; min-height:0; }
  .tool-sidebar{
    display:flex; flex-direction:column; gap:3px; padding:10px 7px;
    background:var(--panel); border-right:1px solid var(--border); flex-shrink:0;
  }
  .tool-sidebar .spacer{flex:1;}
  .tool-divider{ height:1px; background:var(--border); margin:5px 3px; }
  .tool-btn{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:6px; border:1px solid transparent;
    background:transparent; color:var(--muted-2); cursor:pointer;
    transition:background .12s, color .12s;
  }
  .tool-btn:hover{color:var(--text); background:var(--panel-2);}
  .tool-btn.active{background:var(--accent-dim); color:var(--accent);}
  .tool-clear-btn{
    width:36px; height:32px; display:flex; align-items:center; justify-content:center;
    border-radius:6px; border:1px solid transparent;
    background:transparent; color:var(--muted-2); cursor:pointer;
    transition:background .12s, color .12s;
  }
  .tool-clear-btn:hover{color:var(--short); background:var(--short-dim);}

  .chart-main{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column;}

  #chartWrap{ background:var(--bg); position:relative; flex:1; min-height:0; }
  #chart{width:100%; height:100%;}
  #drawCanvas{ position:absolute; inset:0; pointer-events:none; z-index:4; cursor:crosshair; }
  #drawCanvas.active{ pointer-events:auto; }

  #chartOverlay{ position:absolute; inset:0; pointer-events:none; z-index:5; }
  .price-handle{
    position:absolute; left:0; right:0; height:16px; margin-top:-8px;
    cursor:ns-resize; pointer-events:auto; display:none;
  }
  .price-handle::before{ content:''; position:absolute; left:0; right:0; top:8px; height:1px; }
  .price-handle.sl::before{ background:repeating-linear-gradient(to right, var(--short) 0 6px, transparent 6px 11px); }
  .price-handle.tp::before{ background:repeating-linear-gradient(to right, var(--long) 0 6px, transparent 6px 11px); }
  .price-handle .grip{
    position:absolute; right:6px; top:1px; font-family:'IBM Plex Mono',monospace; font-size:10px;
    font-weight:600; padding:1px 6px; border-radius:3px; color:#0e1117;
  }
  .price-handle.sl .grip{ background:var(--short); }
  .price-handle.tp .grip{ background:var(--long); }
  .price-handle:hover::before{ height:2px; top:7px; }
  .empty-chart{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:6px; color:var(--muted); font-size:13px; text-align:center; padding:20px;
  }
  .empty-chart-art{ opacity:.55; margin-bottom:6px; }
  .empty-chart-art .candle{
    opacity:0; transform:scaleY(.3); transform-box:fill-box; transform-origin:bottom;
    animation:candleGrow .5s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:calc(var(--i) * 70ms);
  }
  @keyframes candleGrow{ to{ opacity:1; transform:scaleY(1); } }
  .empty-chart-title{
    font-weight:600; font-size:16px; color:var(--muted-2); letter-spacing:.01em; margin-top:2px;
  }

  /* Bottom bar under chart, TradingView time-scale-bar style */
  .controls{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    background:var(--panel); border-top:1px solid var(--border); padding:7px 10px;
  }
  .controls .spacer{flex:1;}
  .slider-row{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border-top:1px solid var(--border); padding:7px 10px;
  }
  .slider-row input[type=range]{flex:1; accent-color:var(--accent);}
  .bar-info{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted-2);
    display:flex; gap:16px; flex-wrap:wrap;
    background:var(--panel); border-top:1px solid var(--border); padding:7px 10px; margin-bottom:14px;
  }
  .bar-info b{color:var(--text);}

  .trade-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap;}
  .stat{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .stat.pos{color:var(--long);}
  .stat.neg{color:var(--short);}

  table{width:100%; border-collapse:collapse; margin-top:8px;}
  thead th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); padding:7px 9px; border-bottom:1px solid var(--border);
  }
  tbody td{padding:6px 9px; font-size:12px; border-bottom:1px solid var(--border); font-family:'IBM Plex Mono',monospace;}
  tbody tr:last-child td{border-bottom:none;}
  .result.pos{color:var(--long);}
  .result.neg{color:var(--short);}
  .empty-trades{color:var(--muted); font-size:12px; padding:10px 0;}

  /* ===== Right slide-out trade panel ===== */
  .trade-panel{ display:none; flex-shrink:0; border-left:1px solid var(--border); background:var(--panel); }
  .trade-panel-tab{
    writing-mode:vertical-rl; text-orientation:mixed; width:32px; border:none;
    background:transparent; color:var(--muted-2); cursor:pointer;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; padding:16px 0;
  }
  .trade-panel-tab:hover{ color:var(--text); background:var(--panel-2); }
  .trade-panel.open .trade-panel-tab{ background:var(--accent-dim); color:var(--accent); }
  .trade-panel-body{
    width:0; overflow:hidden; padding:0; display:flex; flex-direction:column; gap:8px;
    transition:width .16s ease, padding .16s ease; white-space:nowrap;
  }
  .trade-panel.open .trade-panel-body{ width:200px; padding:12px; }
  .trade-panel-body input, .trade-panel-body .btn{ width:100%; }

  /* ===== Bottom trade log drawer ===== */
  .app{ padding-bottom:34px; }
  .trade-drawer{
    position:fixed; left:0; right:0; bottom:0; background:var(--panel);
    border-top:1px solid var(--border); z-index:30;
    display:none; flex-direction:column-reverse;
  }
  .trade-drawer-header{
    display:flex; align-items:center; gap:10px; padding:8px 14px; cursor:pointer;
    font-size:12px; color:var(--muted-2);
  }
  .trade-drawer-header .stat{ margin-left:auto; }
  #drawerChevron{ transition:transform .15s; flex-shrink:0; }
  .trade-drawer.open #drawerChevron{ transform:rotate(180deg); }
  .trade-drawer-body{
    max-height:0; overflow-y:auto; padding:0 14px; transition:max-height .16s ease;
  }
  .trade-drawer.open .trade-drawer-body{ max-height:280px; padding:4px 14px 14px; }

  footer{margin-top:6px; text-align:center; color:var(--muted); font-size:10.5px; font-family:'IBM Plex Mono',monospace;}

  @media (max-width:720px){
    .chart-shell{ flex-direction:column; }
    .tool-sidebar{ flex-direction:row; border-right:none; border-bottom:1px solid var(--border); }
    .tool-sidebar .spacer{ display:none; }
    .tool-divider{ width:1px; height:auto; margin:3px 5px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>ReplayLab</h1>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="themeToggle" title="Перемкнути тему">🌙</button>
      <button class="btn" id="refreshBtn" title="Підтягнути свіжу версію сторінки">⟳ Оновити</button>
    </div>
  </header>

  <div class="panel-box">
    <div class="loader-row">
      <input type="file" id="fileInput" accept=".csv,.txt">
    </div>
    <p class="hint">Експорт з MT5: графік пари → Сервіс → Центр історії котирувань → символ і таймфрейм → Экспорт → .csv</p>
  </div>

  <div class="chart-shell">
    <div class="tool-sidebar" id="drawToolbar">
      <button class="tool-btn active" id="toolCursor" title="Курсор / панорама">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l7.07 17 2.51-7.39L21 10.07z"/></svg>
      </button>
      <div class="tool-divider"></div>
      <button class="tool-btn" id="toolLine" title="Трендова лінія">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"/><circle cx="4" cy="20" r="1.6" fill="currentColor" stroke="none"/><circle cx="20" cy="4" r="1.6" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tool-btn" id="toolHLine" title="Горизонтальний рівень">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3.2 3.2"><line x1="3" y1="12" x2="21" y2="12"/></svg>
      </button>
      <button class="tool-btn" id="toolRect" title="Зона (прямокутник)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
      </button>
      <div class="tool-divider"></div>
      <button class="tool-btn" id="toolHigh" title="Позначити хай">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      <button class="tool-btn" id="toolLow" title="Позначити лоу">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>
      <div class="spacer"></div>
      <div class="tool-divider"></div>
      <button class="tool-clear-btn" id="clearDrawBtn" title="Очистити малюнки">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
      </button>
    </div>

    <div class="chart-main">
      <div id="chartWrap">
        <div id="chart"></div>
        <div id="chartOverlay">
          <canvas id="drawCanvas"></canvas>
          <div class="price-handle sl" id="slHandle"><span class="grip" id="slGrip">SL</span></div>
          <div class="price-handle tp" id="tpHandle"><span class="grip" id="tpGrip">TP</span></div>
        </div>
        <div class="empty-chart" id="emptyState">
          <svg class="empty-chart-art" width="240" height="100" viewBox="0 0 240 100">
            <g class="candle" style="--i:0"><line x1="12" y1="18" x2="12" y2="70" stroke="#26a69a" stroke-width="1.5"/><rect x="7" y="34" width="10" height="24" fill="#26a69a"/></g>
            <g class="candle" style="--i:1"><line x1="34" y1="40" x2="34" y2="82" stroke="#ef5350" stroke-width="1.5"/><rect x="29" y="46" width="10" height="20" fill="#ef5350"/></g>
            <g class="candle" style="--i:2"><line x1="56" y1="30" x2="56" y2="60" stroke="#26a69a" stroke-width="1.5"/><rect x="51" y="36" width="10" height="16" fill="#26a69a"/></g>
            <g class="candle" style="--i:3"><line x1="78" y1="10" x2="78" y2="52" stroke="#26a69a" stroke-width="1.5"/><rect x="73" y="16" width="10" height="28" fill="#26a69a"/></g>
            <g class="candle" style="--i:4"><line x1="100" y1="34" x2="100" y2="66" stroke="#ef5350" stroke-width="1.5"/><rect x="95" y="38" width="10" height="18" fill="#ef5350"/></g>
            <g class="candle" style="--i:5"><line x1="122" y1="24" x2="122" y2="58" stroke="#ef5350" stroke-width="1.5"/><rect x="117" y="30" width="10" height="18" fill="#ef5350"/></g>
            <g class="candle" style="--i:6"><line x1="144" y1="6" x2="144" y2="46" stroke="#26a69a" stroke-width="1.5"/><rect x="139" y="12" width="10" height="24" fill="#26a69a"/></g>
            <g class="candle" style="--i:7"><line x1="166" y1="20" x2="166" y2="50" stroke="#26a69a" stroke-width="1.5"/><rect x="161" y="24" width="10" height="16" fill="#26a69a"/></g>
            <g class="candle" style="--i:8"><line x1="188" y1="36" x2="188" y2="74" stroke="#ef5350" stroke-width="1.5"/><rect x="183" y="42" width="10" height="22" fill="#ef5350"/></g>
            <g class="candle" style="--i:9"><line x1="210" y1="14" x2="210" y2="48" stroke="#26a69a" stroke-width="1.5"/><rect x="205" y="18" width="10" height="20" fill="#26a69a"/></g>
          </svg>
          <div class="empty-chart-title">ReplayLab</div>
          <div>Завантаж CSV з MT5, щоб почати</div>
        </div>
      </div>

      <div class="controls" id="playbackControls" style="display:none;">
        <button class="btn" id="resetBtn">⏮ Спочатку</button>
        <button class="btn" id="stepBackBtn">⏪ Крок назад</button>
        <button class="btn btn-primary" id="playPauseBtn">▶ Play</button>
        <button class="btn" id="stepFwdBtn">Крок вперед ⏩</button>
        <select id="speedSelect">
          <option value="1500">Повільно</option>
          <option value="700" selected>Звичайно</option>
          <option value="300">Швидко</option>
          <option value="100">Дуже швидко</option>
        </select>
        <div class="spacer"></div>
        <label class="mono" style="font-size:11px; color:var(--muted-2); display:flex; align-items:center; gap:5px;">
          Бичача <input type="color" id="upColorInput" value="#26a69a" style="width:26px; height:24px; padding:2px; border-radius:4px; background:var(--bg); border:1px solid var(--border);">
        </label>
        <label class="mono" style="font-size:11px; color:var(--muted-2); display:flex; align-items:center; gap:5px;">
          Ведмежа <input type="color" id="downColorInput" value="#ef5350" style="width:26px; height:24px; padding:2px; border-radius:4px; background:var(--bg); border:1px solid var(--border);">
        </label>
        <button class="btn" id="randomStartBtn">🎲 Рандомна точка</button>
      </div>

      <div class="slider-row" id="sliderRow" style="display:none;">
        <span class="mono" style="font-size:11px; color:var(--muted);">Позиція:</span>
        <input type="range" id="posSlider" min="0" max="0" value="0">
      </div>

      <div class="bar-info" id="barInfo"></div>
    </div>

    <div class="trade-panel" id="tradePanel">
      <button class="trade-panel-tab" id="tradePanelTab" title="Угода">УГОДА</button>
      <div class="trade-panel-body" id="tradePanelBody">
        <p class="panel-title" style="margin-bottom:8px;">Симулятор угод</p>
        <label class="mono" style="font-size:11px; color:var(--muted-2);">Обʼєм</label>
        <input type="number" id="tradeSize" value="1" step="0.01">
        <label class="mono" style="font-size:11px; color:var(--muted-2);">$/пункт</label>
        <input type="number" id="pointValue" value="1" step="0.01">
        <div style="display:flex; gap:8px;">
          <button class="btn btn-long" id="buyBtn" style="flex:1;">Buy</button>
          <button class="btn btn-short" id="sellBtn" style="flex:1;">Sell</button>
        </div>
        <button class="btn" id="closeBtn" disabled>Close</button>
        <span class="stat" id="openPosInfo"></span>
      </div>
    </div>
  </div>

  <div class="trade-drawer" id="tradeDrawer">
    <div class="trade-drawer-header" id="tradeDrawerHeader">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="drawerChevron"><path d="M18 15l-6-6-6 6"/></svg>
      <span class="mono">Угоди (<b id="tradeCount">0</b>)</span>
      <span class="stat" id="totalResult">0</span>
    </div>
    <div class="trade-drawer-body" id="tradeDrawerBody">
      <table>
        <thead><tr><th>#</th><th>Напрямок</th><th>Вхід</th><th>Вихід</th><th>Обʼєм</th><th>Результат</th></tr></thead>
        <tbody id="tradesBody"></tbody>
      </table>
      <div class="empty-trades" id="emptyTrades">Ще немає угод у цій сесії — натисни Buy або Sell на поточній свічці.</div>
    </div>
  </div>

  </div>

<script>
let allBars = [];
let revealCount = 0;
let chart, candleSeries;
let playing = false;
let playTimer = null;
let openPosition = null;
let closedTrades = [];
let entryLine = null, slLine = null, tpLine = null;
let dragTarget = null; // 'sl' | 'tp' | null

let currentTool = 'cursor';
let drawings = []; // {type:'line'|'hline'|'rect', p1:{time,price}, p2?:{time,price}}
let markers = [];  // for candleSeries.setMarkers
let drawInProgress = null;
let drawCanvas, drawCtx;
const INITIAL_WINDOW = 60;

function initChart(){
  const container = document.getElementById('chart');
  chart = LightweightCharts.createChart(container, {
    autoSize: true,
    layout: { background: { color: '#131722' }, textColor: '#787b86' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    rightPriceScale: { borderColor: '#2a2e39' },
    timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  new ResizeObserver(()=>{
    resizeDrawCanvas();
    repositionHandles();
    redrawDrawings();
  }).observe(container);
  chart.timeScale().subscribeVisibleLogicalRangeChange(()=> { repositionHandles(); redrawDrawings(); });

  drawCanvas = document.getElementById('drawCanvas');
  drawCtx = drawCanvas.getContext('2d');
  resizeDrawCanvas();
}

function resizeDrawCanvas(){
  const rect = document.getElementById('chart').getBoundingClientRect();
  drawCanvas.width = rect.width;
  drawCanvas.height = rect.height;
}

function applyCandleColors(upColor, downColor){
  candleSeries.applyOptions({
    upColor, downColor,
    borderUpColor: upColor, borderDownColor: downColor,
    wickUpColor: upColor, wickDownColor: downColor,
  });
}
document.getElementById('upColorInput').addEventListener('input', (e)=>{
  applyCandleColors(e.target.value, document.getElementById('downColorInput').value);
});
document.getElementById('downColorInput').addEventListener('input', (e)=>{
  applyCandleColors(document.getElementById('upColorInput').value, e.target.value);
});

/* ===== CSV parsing (MT4/MT5 export formats) ===== */
function parseCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length) return [];

  const sample = lines[0];
  let delim = ',';
  const counts = { '\t': (sample.match(/\t/g)||[]).length, ',': (sample.match(/,/g)||[]).length, ';': (sample.match(/;/g)||[]).length };
  delim = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];

  let rows = lines.map(l=>l.split(delim).map(c=>c.replace(/^["<]+|[">]+$/g,'').trim()));

  let headerMap = null;
  const first = rows[0].map(c=>c.toUpperCase());
  if(first.some(c=>/DATE|OPEN|HIGH|LOW|CLOSE|TIME/.test(c))){
    headerMap = {};
    first.forEach((c,i)=>{
      if(/DATE/.test(c)) headerMap.date = i;
      else if(/TIME/.test(c)) headerMap.time = i;
      else if(/OPEN/.test(c)) headerMap.open = i;
      else if(/HIGH/.test(c)) headerMap.high = i;
      else if(/LOW/.test(c)) headerMap.low = i;
      else if(/CLOSE/.test(c)) headerMap.close = i;
    });
    rows = rows.slice(1);
  } else {
    // positional fallback: DATE,TIME,OPEN,HIGH,LOW,CLOSE,VOL  or DATE,OPEN,HIGH,LOW,CLOSE,VOL
    const looksLikeTime = /^\d{1,2}:\d{2}/.test(rows[0][1]||'');
    if(looksLikeTime){
      headerMap = { date:0, time:1, open:2, high:3, low:4, close:5 };
    } else {
      headerMap = { date:0, time:null, open:1, high:2, low:3, close:4 };
    }
  }

  const bars = [];
  for(const r of rows){
    if(r.length < 4) continue;
    const dateStr = r[headerMap.date];
    if(!dateStr) continue;
    const timeStr = headerMap.time!=null ? (r[headerMap.time]||'00:00') : '00:00';
    const dparts = dateStr.split(/[.\-\/]/).map(Number);
    if(dparts.length < 3 || dparts.some(isNaN)) continue;
    const [y,mo,d] = dparts;
    const [hh,mm] = timeStr.split(':').map(Number);
    const t = Math.floor(Date.UTC(y, mo-1, d, hh||0, mm||0) / 1000);
    const o = parseFloat(r[headerMap.open]);
    const h = parseFloat(r[headerMap.high]);
    const l = parseFloat(r[headerMap.low]);
    const c = parseFloat(r[headerMap.close]);
    if([o,h,l,c].some(isNaN)) continue;
    bars.push({ time: t, open:o, high:h, low:l, close:c });
  }
  bars.sort((a,b)=>a.time-b.time);
  // dedupe same-timestamp rows
  const seen = new Set();
  return bars.filter(b=>{ if(seen.has(b.time)) return false; seen.add(b.time); return true; });
}

function loadBars(bars){
  if(bars.length < 5){
    alert('Не вдалось розпізнати дані у файлі — перевір формат CSV.');
    return;
  }
  allBars = bars;
  revealCount = Math.min(INITIAL_WINDOW, allBars.length);
  closedTrades = [];
  openPosition = null;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('playbackControls').style.display = 'flex';
  document.getElementById('sliderRow').style.display = 'flex';
  document.getElementById('tradePanel').style.display = 'flex';
  document.getElementById('tradeDrawer').style.display = 'flex';
  const slider = document.getElementById('posSlider');
  slider.min = INITIAL_WINDOW;
  slider.max = allBars.length;
  slider.value = revealCount;
  renderTrades();
  render(true);
}

function render(fit){
  const visible = allBars.slice(0, revealCount);
  if(fit) chart.priceScale('right').applyOptions({ autoScale: true });
  candleSeries.setData(visible);
  if(fit){
    chart.timeScale().fitContent();
    requestAnimationFrame(()=> chart.priceScale('right').applyOptions({ autoScale: false }));
  }
  document.getElementById('posSlider').value = revealCount;

  const last = visible[visible.length-1];
  const infoEl = document.getElementById('barInfo');
  if(last){
    const d = new Date(last.time*1000);
    const ds = d.toISOString().slice(0,16).replace('T',' ');
    infoEl.innerHTML = `
      <span>${ds}</span>
      <span>O <b>${last.open}</b></span>
      <span>H <b>${last.high}</b></span>
      <span>L <b>${last.low}</b></span>
      <span>C <b>${last.close}</b></span>
      <span>${revealCount} / ${allBars.length} барів</span>
    `;
  }
  updateOpenPosInfo();
  document.getElementById('stepFwdBtn').disabled = revealCount >= allBars.length;
  document.getElementById('closeBtn').disabled = !openPosition;
  document.getElementById('buyBtn').disabled = !!openPosition;
  document.getElementById('sellBtn').disabled = !!openPosition;
  repositionHandles();
  redrawDrawings();
}

function stepForward(){
  if(revealCount >= allBars.length){ pausePlay(); return; }
  revealCount++;
  checkStopHit();
  render();
}
function stepBack(){
  if(revealCount <= INITIAL_WINDOW) return;
  revealCount--;
  render();
}

function checkStopHit(){
  if(!openPosition) return;
  const bar = allBars[revealCount-1];
  const { dir, slPrice, tpPrice } = openPosition;
  let hitPrice = null;
  if(dir==='long'){
    if(slPrice!=null && bar.low <= slPrice) hitPrice = slPrice;
    else if(tpPrice!=null && bar.high >= tpPrice) hitPrice = tpPrice;
  } else {
    if(slPrice!=null && bar.high >= slPrice) hitPrice = slPrice;
    else if(tpPrice!=null && bar.low <= tpPrice) hitPrice = tpPrice;
  }
  if(hitPrice!=null) finishTrade(hitPrice);
}

function playPause(){
  if(playing){ pausePlay(); return; }
  playing = true;
  document.getElementById('playPauseBtn').textContent = '⏸ Pause';
  const speed = parseInt(document.getElementById('speedSelect').value);
  playTimer = setInterval(()=>{
    if(revealCount >= allBars.length){ pausePlay(); return; }
    stepForward();
  }, speed);
}
function pausePlay(){
  playing = false;
  document.getElementById('playPauseBtn').textContent = '▶ Play';
  if(playTimer) clearInterval(playTimer);
  playTimer = null;
}

document.getElementById('playPauseBtn').addEventListener('click', playPause);
document.getElementById('stepFwdBtn').addEventListener('click', ()=>{ pausePlay(); stepForward(); });
document.getElementById('stepBackBtn').addEventListener('click', ()=>{ pausePlay(); stepBack(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  pausePlay();
  revealCount = Math.min(INITIAL_WINDOW, allBars.length);
  render(true);
});
document.getElementById('randomStartBtn').addEventListener('click', ()=>{
  pausePlay();
  const maxStart = Math.max(INITIAL_WINDOW, allBars.length - 30);
  revealCount = INITIAL_WINDOW + Math.floor(Math.random() * Math.max(1, maxStart - INITIAL_WINDOW));
  openPosition = null;
  render(true);
});
document.getElementById('posSlider').addEventListener('input', (e)=>{
  pausePlay();
  revealCount = parseInt(e.target.value);
  render(true);
});
document.getElementById('speedSelect').addEventListener('change', ()=>{
  if(playing){ pausePlay(); playPause(); }
});

/* ===== Trade simulator ===== */
function updateOpenPosInfo(){
  const el = document.getElementById('openPosInfo');
  if(!openPosition){ el.textContent = ''; return; }
  const last = allBars[revealCount-1];
  const diff = (last.close - openPosition.entry) * (openPosition.dir==='long'?1:-1);
  const result = diff * openPosition.size * parseFloat(document.getElementById('pointValue').value || 1);
  el.className = 'stat ' + (result>=0?'pos':'neg');
  el.textContent = `Відкрито: ${openPosition.dir.toUpperCase()} @ ${openPosition.entry} — плаваючий: ${result>=0?'+':''}${result.toFixed(2)}`;
}

function removePositionLines(){
  if(entryLine){ candleSeries.removePriceLine(entryLine); entryLine = null; }
  if(slLine){ candleSeries.removePriceLine(slLine); slLine = null; }
  if(tpLine){ candleSeries.removePriceLine(tpLine); tpLine = null; }
  document.getElementById('slHandle').style.display = 'none';
  document.getElementById('tpHandle').style.display = 'none';
}

function openTrade(dir){
  if(openPosition || !allBars.length) return;
  const last = allBars[revealCount-1];
  const entry = last.close;

  entryLine = candleSeries.createPriceLine({
    price: entry, color: '#26a69a', lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: 'Вхід'
  });

  // default SL/TP placed ~50px above/below entry on screen, converted to price
  const entryY = candleSeries.priceToCoordinate(entry) ?? 200;
  const offsetPrice = Math.abs((candleSeries.coordinateToPrice(entryY - 50) ?? entry) - entry) || (entry*0.003);
  const slPrice = dir==='long' ? entry - offsetPrice : entry + offsetPrice;
  const tpPrice = dir==='long' ? entry + offsetPrice : entry - offsetPrice;

  slLine = candleSeries.createPriceLine({
    price: slPrice, color: '#ef5350', lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'SL'
  });
  tpLine = candleSeries.createPriceLine({
    price: tpPrice, color: '#26a69a', lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'TP'
  });

  openPosition = { dir, entry, size: parseFloat(document.getElementById('tradeSize').value||1), slPrice, tpPrice };
  render();
  repositionHandles();
}

function finishTrade(exitPrice, reasonHit){
  if(!openPosition) return;
  const diff = (exitPrice - openPosition.entry) * (openPosition.dir==='long'?1:-1);
  const result = diff * openPosition.size * parseFloat(document.getElementById('pointValue').value || 1);
  closedTrades.push({ dir: openPosition.dir, entry: openPosition.entry, exit: exitPrice, size: openPosition.size, result, reason: reasonHit||'' });
  removePositionLines();
  openPosition = null;
  renderTrades();
  render();
}

function closeTrade(){
  if(!openPosition) return;
  const last = allBars[revealCount-1];
  finishTrade(last.close, 'manual');
}

/* ===== SL/TP dragging ===== */
function repositionHandles(){
  const slEl = document.getElementById('slHandle');
  const tpEl = document.getElementById('tpHandle');
  if(!openPosition || !candleSeries){ slEl.style.display='none'; tpEl.style.display='none'; return; }
  const chartH = document.getElementById('chart').clientHeight;
  const slY = candleSeries.priceToCoordinate(openPosition.slPrice);
  const tpY = candleSeries.priceToCoordinate(openPosition.tpPrice);
  if(slY!=null && slY>=0 && slY<=chartH){ slEl.style.top = slY+'px'; slEl.style.display='block'; }
  else slEl.style.display='none';
  if(tpY!=null && tpY>=0 && tpY<=chartH){ tpEl.style.top = tpY+'px'; tpEl.style.display='block'; }
  else tpEl.style.display='none';
}

function startDrag(target, e){
  e.preventDefault();
  dragTarget = target;
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
}
let dragRafPending = false;
function onDragMove(e){
  if(!dragTarget || !openPosition) return;
  if(dragRafPending) return;
  dragRafPending = true;
  requestAnimationFrame(()=>{
    dragRafPending = false;
    const rect = document.getElementById('chart').getBoundingClientRect();
    const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
    const price = candleSeries.coordinateToPrice(y);
    if(price==null) return;
    if(dragTarget==='sl'){
      openPosition.slPrice = price;
      slLine.applyOptions({ price });
      document.getElementById('slHandle').style.top = y+'px';
    } else {
      openPosition.tpPrice = price;
      tpLine.applyOptions({ price });
      document.getElementById('tpHandle').style.top = y+'px';
    }
  });
}
function onDragEnd(){
  dragTarget = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
}
document.getElementById('slHandle').addEventListener('pointerdown', (e)=>startDrag('sl', e));
document.getElementById('tpHandle').addEventListener('pointerdown', (e)=>startDrag('tp', e));

document.getElementById('buyBtn').addEventListener('click', ()=>openTrade('long'));
document.getElementById('sellBtn').addEventListener('click', ()=>openTrade('short'));
document.getElementById('closeBtn').addEventListener('click', closeTrade);

function renderTrades(){
  const body = document.getElementById('tradesBody');
  const empty = document.getElementById('emptyTrades');
  if(closedTrades.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    body.innerHTML = closedTrades.map((t,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${t.dir.toUpperCase()}</td>
        <td>${t.entry}</td>
        <td>${t.exit}</td>
        <td>${t.size}</td>
        <td class="result ${t.result>=0?'pos':'neg'}">${t.result>=0?'+':''}${t.result.toFixed(2)}</td>
      </tr>
    `).join('');
  }
  const total = closedTrades.reduce((s,t)=>s+t.result,0);
  document.getElementById('tradeCount').textContent = closedTrades.length;
  const totalEl = document.getElementById('totalResult');
  totalEl.className = 'stat ' + (total>=0?'pos':'neg');
  totalEl.textContent = (total>=0?'+':'') + total.toFixed(2);
}

/* ===== File / demo loading ===== */
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const bars = parseCSV(ev.target.result);
    loadBars(bars);
  };
  reader.readAsText(file);
});

/* ===== Drawing tools ===== */
function setTool(tool){
  currentTool = tool;
  drawInProgress = null;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  const idMap = { cursor:'toolCursor', line:'toolLine', hline:'toolHLine', rect:'toolRect', high:'toolHigh', low:'toolLow' };
  document.getElementById(idMap[tool]).classList.add('active');
  drawCanvas.classList.toggle('active', tool!=='cursor');
}
document.getElementById('toolCursor').addEventListener('click', ()=>setTool('cursor'));
document.getElementById('toolLine').addEventListener('click', ()=>setTool('line'));
document.getElementById('toolHLine').addEventListener('click', ()=>setTool('hline'));
document.getElementById('toolRect').addEventListener('click', ()=>setTool('rect'));
document.getElementById('toolHigh').addEventListener('click', ()=>setTool('high'));
document.getElementById('toolLow').addEventListener('click', ()=>setTool('low'));
document.getElementById('clearDrawBtn').addEventListener('click', ()=>{
  drawings = [];
  markers = [];
  if(candleSeries) candleSeries.setMarkers([]);
  redrawDrawings();
});

function pxToPoint(x, y){
  const rect = drawCanvas.getBoundingClientRect();
  const cx = Math.max(0, Math.min(rect.width, x));
  const cy = Math.max(0, Math.min(rect.height, y));
  const time = chart.timeScale().coordinateToTime(cx);
  const price = candleSeries.coordinateToPrice(cy);
  return { time, price, x: cx, y: cy };
}
function nearestBar(x){
  if(!allBars.length) return null;
  const time = chart.timeScale().coordinateToTime(x);
  if(time==null) return null;
  const visible = allBars.slice(0, revealCount);
  let best = visible[0], bestDiff = Infinity;
  for(const b of visible){
    const diff = Math.abs(b.time - time);
    if(diff < bestDiff){ bestDiff = diff; best = b; }
  }
  return best;
}

document.getElementById('drawCanvas').addEventListener('pointerdown', (e)=>{
  if(currentTool==='cursor') return;
  const rect = drawCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;

  if(currentTool==='hline'){
    const price = candleSeries.coordinateToPrice(y);
    if(price!=null) drawings.push({ type:'hline', p1:{ price } });
    redrawDrawings();
    return;
  }
  if(currentTool==='high' || currentTool==='low'){
    const bar = nearestBar(x);
    if(bar){
      markers.push({
        time: bar.time,
        position: currentTool==='high' ? 'aboveBar' : 'belowBar',
        color: currentTool==='high' ? '#26a69a' : '#ef5350',
        shape: currentTool==='high' ? 'arrowDown' : 'arrowUp',
        text: currentTool==='high' ? 'H' : 'L',
      });
      markers.sort((a,b)=>a.time-b.time);
      candleSeries.setMarkers(markers);
    }
    return;
  }
  // line or rect: start drag — abort if the click doesn't resolve to a real point
  // (e.g. outside the plotted data), which previously produced invisible drawings
  const p = pxToPoint(x, y);
  if(p.time==null || p.price==null) return;
  drawInProgress = { type: currentTool, p1: p, p2: p };
  document.addEventListener('pointermove', onDrawMove);
  document.addEventListener('pointerup', onDrawEnd);
});

let drawRafPending = false;
function onDrawMove(e){
  if(!drawInProgress) return;
  if(drawRafPending) return;
  drawRafPending = true;
  requestAnimationFrame(()=>{
    drawRafPending = false;
    if(!drawInProgress) return;
    const rect = drawCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const p = pxToPoint(x, y);
    if(p.time==null || p.price==null) return;
    drawInProgress.p2 = p;
    redrawDrawings();
  });
}
function onDrawEnd(){
  if(drawInProgress){
    drawings.push(drawInProgress);
    drawInProgress = null;
  }
  document.removeEventListener('pointermove', onDrawMove);
  document.removeEventListener('pointerup', onDrawEnd);
  redrawDrawings();
}

function redrawDrawings(){
  if(!drawCtx) return;
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  const all = drawInProgress ? [...drawings, drawInProgress] : drawings;
  for(const d of all){
    if(d.type === 'hline'){
      const y = candleSeries.priceToCoordinate(d.p1.price);
      if(y==null) continue;
      drawCtx.strokeStyle = '#2962ff';
      drawCtx.lineWidth = 1;
      drawCtx.setLineDash([5,4]);
      drawCtx.beginPath();
      drawCtx.moveTo(0, y);
      drawCtx.lineTo(drawCanvas.width, y);
      drawCtx.stroke();
      drawCtx.setLineDash([]);
    } else {
      const x1 = chart.timeScale().timeToCoordinate(d.p1.time);
      const y1 = candleSeries.priceToCoordinate(d.p1.price);
      const x2 = chart.timeScale().timeToCoordinate(d.p2.time);
      const y2 = candleSeries.priceToCoordinate(d.p2.price);
      if(x1==null||y1==null||x2==null||y2==null) continue;
      if(d.type === 'line'){
        drawCtx.strokeStyle = '#2962ff';
        drawCtx.lineWidth = 1.5;
        drawCtx.beginPath();
        drawCtx.moveTo(x1,y1);
        drawCtx.lineTo(x2,y2);
        drawCtx.stroke();
      } else if(d.type === 'rect'){
        drawCtx.fillStyle = 'rgba(41,98,255,0.12)';
        drawCtx.strokeStyle = 'rgba(41,98,255,0.6)';
        drawCtx.lineWidth = 1;
        const rx = Math.min(x1,x2), ry = Math.min(y1,y2);
        const rw = Math.abs(x2-x1), rh = Math.abs(y2-y1);
        drawCtx.fillRect(rx,ry,rw,rh);
        drawCtx.strokeRect(rx,ry,rw,rh);
      }
    }
  }
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    if(drawInProgress){
      drawInProgress = null;
      document.removeEventListener('pointermove', onDrawMove);
      document.removeEventListener('pointerup', onDrawEnd);
      redrawDrawings();
    }
    setTool('cursor');
  }
});

let currentTheme = 'dark';
function applyChartTheme(theme){
  if(!chart) return;
  const light = theme === 'light';
  chart.applyOptions({
    layout: {
      background: { color: light ? '#ffffff' : '#131722' },
      textColor: light ? '#5d606b' : '#787b86',
    },
    grid: {
      vertLines: { color: light ? '#e0e3eb' : '#1e222d' },
      horzLines: { color: light ? '#e0e3eb' : '#1e222d' },
    },
    rightPriceScale: { borderColor: light ? '#e0e3eb' : '#2a2e39' },
    timeScale: { borderColor: light ? '#e0e3eb' : '#2a2e39' },
  });
}
document.getElementById('tradePanelTab').addEventListener('click', ()=>{
  document.getElementById('tradePanel').classList.toggle('open');
  setTimeout(()=>{ resizeDrawCanvas(); repositionHandles(); redrawDrawings(); }, 180);
});
document.getElementById('tradeDrawerHeader').addEventListener('click', ()=>{
  document.getElementById('tradeDrawer').classList.toggle('open');
});

document.getElementById('themeToggle').addEventListener('click', ()=>{
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.getElementById('themeToggle').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
  applyChartTheme(currentTheme);
});

document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  const url = window.location.pathname + '?v=' + Date.now();
  window.location.replace(url);
});

initChart();
